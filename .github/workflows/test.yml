name: tests

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  hook-tests:
    name: hook tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Install jq (macos)
        if: matrix.os == 'macos-latest'
        run: |
          command -v jq >/dev/null || brew install jq

      - name: Show toolchain
        run: |
          bash --version | head -1
          jq --version
          git --version

      - name: Run hook + dev tests
        run: bash tests/run.sh

      - name: End-to-end dry-run
        run: bash plugins/pilot/dev/dry-run.sh

  shellcheck:
    name: shellcheck (hooks + dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck hooks/
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: 'plugins/pilot/hooks'
          severity: warning

      - name: shellcheck dev/
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: 'plugins/pilot/dev'
          severity: warning

  floor:
    name: production-quality floor (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Run the executable floor (tests + secret scan + lint)
        run: bash plugins/pilot/dev/floor-check.sh

  plugin-manifest:
    name: validate plugin.json + marketplace.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: all plugin manifests are valid JSON with required fields
        run: |
          for f in plugins/*/.claude-plugin/plugin.json; do
            jq empty "$f"
            jq -e '.name and .version and .description and .license and .skills' "$f" \
              || { echo "missing required field in $f"; exit 1; }
          done

      - name: marketplace.json is valid, lists every plugin dir
        run: |
          jq empty .claude-plugin/marketplace.json
          jq -e '.name and .owner and (.plugins | length > 0)' \
            .claude-plugin/marketplace.json
          for d in plugins/*/; do
            name=$(basename "$d")
            jq -e --arg n "$name" '.plugins | any(.name == $n)' \
              .claude-plugin/marketplace.json >/dev/null \
              || { echo "plugins/$name missing from marketplace.json"; exit 1; }
          done

      - name: pilot plugin wires hooks + well-formed mcpServers
        run: |
          PILOT=plugins/pilot/.claude-plugin/plugin.json
          jq -e '.hooks' "$PILOT"
          # Every entry is either a local command server (.command string) or
          # a hosted server (.type=="http" with a .url string).
          jq -e '
            (.mcpServers // {})
            | to_entries
            | all(
                (.value.command and (.value.command | type == "string"))
                or (.value.type == "http" and (.value.url | type == "string"))
              )
          ' "$PILOT"
          # If any entry uses args, all elements must be strings.
          jq -e '
            (.mcpServers // {})
            | to_entries
            | all(
                (.value.args // []) | type == "array" and all(. | type == "string")
              )
          ' "$PILOT"

  vendored-board:
    name: vendored story board (plugins/pilot/templates/board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # templates/board is a COPY of appbuild-structure/factory-board, scaffolded
      # into new repos by Bootstrap step 6. Nothing detects the original moving
      # ahead — see plugins/pilot/templates/board/VENDORED.md. This job proves
      # only that the copy passes its own suite, which is the difference between
      # shipping code we have run and code we have merely pasted.
      - name: Install board dependencies
        working-directory: plugins/pilot/templates/board
        run: npm ci

      - name: Run the board suite
        working-directory: plugins/pilot/templates/board
        run: npm test
